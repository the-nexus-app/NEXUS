name: Update website

on:
  release:
    types:
      - published
      - deleted
      - edited

jobs:
  update_website:
    runs-on: 'ubuntu-24.04'
    # Inherited from Komikku upstream: this dispatches to Komikku's own website repo.
    # NEXUS has no equivalent website repo, and this workflow triggers on
    # `release: published` - which now fires on every NEXUS release since the release
    # workflow no longer creates drafts. Guarded so it is a no-op in this repo instead
    # of failing loudly on each release. Remove the guard and repoint `repo:` below if
    # NEXUS ever gets its own website repo.
    if: github.repository == 'komikku-app/komikku'

    steps:
      - name: Update website on release
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: Deploy
          repo: komikku-app/komikku-app.github.io
          ref: "refs/heads/main"
          token: "${{ secrets.BOT_PAT }}"
